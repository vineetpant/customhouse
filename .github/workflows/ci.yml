# Only actions/checkout is used. The Rust toolchain and Node are preinstalled on
# GitHub runners, so this workflow pulls in no third-party actions — the same
# dependency-minimalism the project applies to its own build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test, lint, hermetic demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # These two need only the Rust toolchain and run in throwaway directories.
      # Each asserts its own security property and exits non-zero if it regresses,
      # so a green run here is a claim about enforcement, not just about compiling.
      - name: Demo — self-protection and audit ledger
        run: ./demo/run.sh

      - name: Demo — rug-pull withheld until re-pinned
        run: ./demo/run_rugpull.sh

  real-server:
    name: self-protection vs a real MCP server
    runs-on: ubuntu-latest
    # Separated from the gate above because it fetches the upstream server from
    # npm: a registry outage should not be reported as a security regression.
    # It still runs on every push, and its failure is visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run against @modelcontextprotocol/server-filesystem
        run: ./demo/run_selfprotect_real.sh
