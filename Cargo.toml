[package]
name = "bulkhead"
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Deterministic reference monitor for the MCP tool boundary — an aggregating proxy that enforces that untrusted input cannot drive sensitive output."

[[bin]]
name = "bulkhead"
path = "src/main.rs"

[lib]
name = "bulkhead"
path = "src/lib.rs"

[dependencies]
# Pinned exactly. Never write rmcp API calls from memory — verify against the
# source of this exact version (see CLAUDE.md).
rmcp = { version = "=2.2.0", features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
