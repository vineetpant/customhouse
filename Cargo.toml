[package]
name = "customhouse"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
# Describes what this release actually does. Scope limits — session-scoped
# granularity, the measured false-positive cost — are in SECURITY.md and
# METRICS.md rather than softened away here.
description = "Deterministic reference monitor for the MCP tool boundary: blocks money-moving and data-egress tool calls in any agent session that has received untrusted content, with no model in the decision path."
repository = "https://github.com/vineetpant/customhouse"
readme = "README.md"
keywords = ["mcp", "security", "ai-agents", "prompt-injection", "proxy"]
categories = ["command-line-utilities", "network-programming", "development-tools"]
# CI config and the Pages site are excluded; the latter is a rendered copy of
# material already in the repo and is served from the website, not read from the
# crate. The design doc, examples and demos DO ship: for a security tool, being
# able to read the reasoning and re-run the demos from the published package is
# worth more than a smaller tarball.
exclude = ["/.github", "/docs"]

[[bin]]
name = "customhouse"
path = "src/main.rs"

[lib]
name = "customhouse"
path = "src/lib.rs"

[dependencies]
# Pinned exactly. Never write rmcp API calls from memory — verify against the
# source of this exact version (see CLAUDE.md).
rmcp = { version = "=2.2.0", features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
# Hashing is the feature, not an incidental convenience, so a real
# implementation is required. Considered and rejected: hand-rolling SHA-256
# (writing your own primitive to save a dependency is worse than the
# dependency), and reusing the canonical-JSON equality trick from `pin` (that
# detects a changed value, but cannot chain entries so that altering one
# invalidates every later one).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
