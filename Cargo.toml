[package]
name = "penstock"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
# Describes what this release actually does. The flow-enforcement rule (untrusted
# input must not reach a sensitive sink) is Phase 1 and deliberately not claimed
# here — see SECURITY.md.
description = "Deterministic reference monitor for the MCP tool boundary: an aggregating proxy with compiled-in self-protection, tool-definition pinning against rug pulls, and an append-only audit ledger."
repository = "https://github.com/vineetpant/penstock"
readme = "README.md"
keywords = ["mcp", "security", "ai-agents", "prompt-injection", "proxy"]
categories = ["command-line-utilities", "network-programming", "development-tools"]
# Only CI config is excluded. The design doc, examples and demos ship with the
# crate: for a security tool, being able to read the reasoning and re-run the
# demos from the published package is worth more than a smaller tarball.
exclude = ["/.github"]

[[bin]]
name = "penstock"
path = "src/main.rs"

[lib]
name = "penstock"
path = "src/lib.rs"

[dependencies]
# Pinned exactly. Never write rmcp API calls from memory — verify against the
# source of this exact version (see CLAUDE.md).
rmcp = { version = "=2.2.0", features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
