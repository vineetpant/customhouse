[package]
name = "bulkhead"
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Deterministic reference monitor for the MCP tool boundary — an aggregating proxy that enforces that untrusted input cannot drive sensitive output."
repository = "https://github.com/REPLACE_ME/bulkhead"

[[bin]]
name = "bulkhead"
path = "src/main.rs"

[lib]
name = "bulkhead"
path = "src/lib.rs"

[dependencies]
# Pinned exactly. Never write rmcp API calls from memory — verify against the
# source of this exact version (see CLAUDE.md).
rmcp = { version = "=2.2.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

[dev-dependencies]
